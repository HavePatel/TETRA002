version: '3.8'

services:
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8001:8001"
    env_file:
      - ./ai/.env
    volumes:
      - ./ai/temp:/app/temp
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=http://ai-service:8001/api/v1/extract
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/invoice_scanner.db:/app/invoice_scanner.db
    depends_on:
      - ai-service
    restart: unless-stopped
